<!DOCTYPE html>
<html lang="en">

<head>
    <title>CSS Selectors Example</title>
    <style>
        h1 {
            color: darkblue;
            text-align: center;
        }


        .highlight {
            background-color: yellow;
            padding: 5px;
        }


        #unique {
            color: red;
            font-weight: bold;
        }


        p,
        li {
            font-family: Arial, sans-serif;
            line-height: 1.5;
        }
    </style>
</head>

<body>
    <h1>Welcome to CSS Selectors</h1>

    <p>This is a normal paragraph.</p>
    <p class="highlight">This paragraph has a class applied.</p>
    <p id="unique">This paragraph has a unique ID.</p>

    <ul>
        <li>List item 1</li>
        <li class="highlight">List item 2 with class</li>
        <li id="unique">List item 3 with ID</li>
    </ul>
</body>

</html>
