<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Flexbox Basics</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        h2 {
            margin-top: 40px;
        }


        .flex-container {
            background-color: #f0f0f0;
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
        }

        .flex-item {
            background-color: #6a5acd;
            color: white;
            padding: 20px;
            margin: 5px;
            text-align: center;
            flex: 0 0 100px;
        }


        .row {
            flex-direction: row;
        }

        .row-reverse {
            flex-direction: row-reverse;
        }

        .column {
            flex-direction: column;
        }

        .column-reverse {
            flex-direction: column-reverse;
        }


        .justify-start {
            justify-content: flex-start;
        }

        .justify-end {
            justify-content: flex-end;
        }

        .justify-center {
            justify-content: center;
        }

        .justify-space-between {
            justify-content: space-between;
        }

        .justify-space-around {
            justify-content: space-around;
        }

        .justify-space-evenly {
            justify-content: space-evenly;
        }
    </style>
</head>

<body>
    <h2>Flex Direction - Row (default)</h2>
    <div class="flex-container row">
        <div class="flex-item">1</div>
        <div class="flex-item">2</div>
        <div class="flex-item">3</div>
    </div>

    <h2>Flex Direction - Column</h2>
    <div class="flex-container column">
        <div class="flex-item">1</div>
        <div class="flex-item">2</div>
        <div class="flex-item">3</div>
    </div>

    <h2>Justify Content Examples</h2>
    <div class="flex-container row justify-start">
        <div class="flex-item">Start</div>
        <div class="flex-item">Start</div>
        <div class="flex-item">Start</div>
    </div>

    <div class="flex-container row justify-center">
        <div class="flex-item">Center</div>
        <div class="flex-item">Center</div>
        <div class="flex-item">Center</div>
    </div>

    <div class="flex-container row justify-end">
        <div class="flex-item">End</div>
        <div class="flex-item">End</div>
        <div class="flex-item">End</div>
    </div>

    <div class="flex-container row justify-space-between">
        <div class="flex-item">Space Between</div>
        <div class="flex-item">Space Between</div>
        <div class="flex-item">Space Between</div>
    </div>

    <div class="flex-container row justify-space-around">
        <div class="flex-item">Space Around</div>
        <div class="flex-item">Space Around</div>
        <div class="flex-item">Space Around</div>
    </div>

    <div class="flex-container row justify-space-evenly">
        <div class="flex-item">Space Evenly</div>
        <div class="flex-item">Space Evenly</div>
        <div class="flex-item">Space Evenly</div>
    </div>
</body>

</html>
