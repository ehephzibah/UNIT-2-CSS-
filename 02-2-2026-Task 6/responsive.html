<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Design Basics</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
        }

        header {
            background-color: #6a5acd;
            color: white;
            text-align: center;
            padding: 20px;
            font-size: 20px;
        }

        nav {
            display: flex;
            flex-direction: column;
            background-color: #ff7f50;
        }

        nav a {
            color: white;
            text-decoration: none;
            padding: 10px 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
        }

        main {
            padding: 15px;
        }

        .content {
            background-color: #f4f4f4;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 8px;
        }


        @media (min-width: 600px) {
            nav {
                flex-direction: row;
                justify-content: center;
            }

            nav a {
                border-bottom: none;
                border-right: 1px solid rgba(255, 255, 255, 0.3);
            }

            nav a:last-child {
                border-right: none;
            }

            header {
                font-size: 24px;
                padding: 25px;
            }
        }


        @media (min-width: 1024px) {
            body {
                display: flex;
                flex-direction: column;
                align-items: center;
            }

            main {
                max-width: 1024px;
                width: 100%;
            }

            .content {
                padding: 20px;
                font-size: 18px;
            }
        }
    </style>
</head>

<body>

    <header>My Responsive Website</header>

    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Services</a>
        <a href="#">Contact</a>
    </nav>

    <main>
        <div class="content">Lorem ipsum dolor sit amet, consectetur adipiscing elit.</div>
        <div class="content">Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua.</div>
        <div class="content">Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris.</div>
    </main>

</body>

</html>
