<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox Layout - Navbar & Product Listing</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
        }


        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #6a5acd;
            color: white;
            padding: 15px 20px;
            flex-wrap: wrap;
        }

        .navbar .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .navbar .nav-links {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .navbar .nav-links a {
            color: white;
            text-decoration: none;
            font-weight: 500;
            padding: 5px 10px;
            transition: background 0.3s;
        }

        .navbar .nav-links a:hover {
            background-color: rgba(255, 255, 255, 0.2);
            border-radius: 5px;
        }


        .products {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            padding: 20px;
            justify-content: center;
            background-color: #f4f4f4;
        }

        .product-card {
            background-color: white;
            border: 1px solid #ccc;
            border-radius: 10px;
            padding: 15px;
            width: 250px;
            text-align: center;
            box-shadow: 0 3px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.2);
        }

        .product-card img {
            width: 100%;
            height: auto;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .product-card h3 {
            margin: 10px 0 5px;
        }

        .product-card p {
            margin: 5px 0;
            color: #555;
        }

        .product-card .price {
            font-weight: bold;
            color: #6a5acd;
        }

        @media (max-width: 768px) {
            .navbar {
                flex-direction: column;
                align-items: flex-start;
            }

            .navbar .nav-links {
                flex-direction: column;
                width: 100%;
            }

            .products {
                justify-content: center;
            }
        }
    </style>
</head>

<body>

    <div class="navbar">
        <div class="logo">MyShop</div>
        <div class="nav-links">
            <a href="#">Home</a>
            <a href="#">Products</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </div>
    </div>


    <div class="products">
        <div class="product-card">
            <img src="https://via.placeholder.com/250x150" alt="Product 1">
            <h3>Product 1</h3>
            <p>High quality item</p>
            <p class="price">$49.99</p>
        </div>
        <div class="product-card">
            <img src="https://via.placeholder.com/250x150" alt="Product 2">
            <h3>Product 2</h3>
            <p>Top-notch features</p>
            <p class="price">$59.99</p>
        </div>
        <div class="product-card">
            <img src="https://via.placeholder.com/250x150" alt="Product 3">
            <h3>Product 3</h3>
            <p>Best seller</p>
            <p class="price">$39.99</p>
        </div>
        <div class="product-card">
            <img src="https://via.placeholder.com/250x150" alt="Product 4">
            <h3>Product 4</h3>
            <p>Limited edition</p>
            <p class="price">$69.99</p>
        </div>
    </div>

</body>

</html>
